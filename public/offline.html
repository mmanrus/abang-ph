<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <meta
      name="theme-color"
      content="#059669"
    />

    <title>You're offline | Abang PH</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #fafafa;
        color: #18181b;
        font-family:
          Arial,
          Helvetica,
          sans-serif;
      }

      body {
        min-height: 100dvh;

        display: flex;
        align-items: center;
        justify-content: center;

        padding:
          max(24px, env(safe-area-inset-top))
          max(20px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(20px, env(safe-area-inset-left));
      }

      .card {
        width: 100%;
        max-width: 440px;

        border: 1px solid #e4e4e7;
        border-radius: 24px;

        background: white;

        padding: 32px;

        text-align: center;

        box-shadow:
          0 12px 35px
          rgba(24, 24, 27, 0.06);
      }

      .logo {
        width: 64px;
        height: 64px;

        margin: 0 auto;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 18px;

        background: #059669;
        color: white;

        font-size: 26px;
        font-weight: 700;
      }

      h1 {
        margin: 24px 0 0;

        font-size: 26px;
        line-height: 1.2;
      }

      p {
        margin: 12px auto 0;

        max-width: 340px;

        color: #71717a;

        font-size: 15px;
        line-height: 1.6;
      }

      button {
        width: 100%;
        min-height: 48px;

        margin-top: 28px;

        border: 0;
        border-radius: 12px;

        background: #059669;
        color: white;

        font-size: 14px;
        font-weight: 600;

        cursor: pointer;
      }

      button:hover {
        background: #047857;
      }

      button:focus-visible {
        outline: 4px solid
          rgba(5, 150, 105, 0.2);

        outline-offset: 2px;
      }

      .brand {
        margin-top: 20px;

        color: #a1a1aa;

        font-size: 12px;
      }
    </style>
  </head>

  <body>
    <main class="card">
      <div
        class="logo"
        aria-hidden="true"
      >
        A
      </div>

      <h1>
        You're offline
      </h1>

      <p>
        Abang needs an internet connection
        to safely load your rental records.
        Reconnect to the internet, then try again.
      </p>

      <button
        type="button"
        onclick="window.location.reload()"
      >
        Try again
      </button>

      <div class="brand">
        Abang PH
      </div>
    </main>
  </body>
</html>
